<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Daily Planner — Dil kontrolü</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8ee;color:#233147;font:16px/1.6 system-ui}main{max-width:1000px;margin:auto;padding:25px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:28px}select,button,a{font:inherit}select,button{padding:9px 14px;border-radius:12px;border:1px solid #8f9aaa;background:white;color:#243448}button{cursor:pointer}button[aria-pressed=true]{background:#087ce7;color:white}a{color:#086ac0}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.frame{width:390px;max-width:100%;margin:25px auto;background:#fff;border:1px solid #dbc4a5;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px #76572a1c}iframe{width:100%;height:844px;border:0;display:block}.note{color:#5e6c77;font-size:14px}</style></head><body><main><header><h1>Daily Planner · Dil kontrolü</h1><select id="locale" aria-label="Dil"><option value="tr">Türkçe</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option><option value="ja">日本語</option><option value="ko">한국어</option></select></header><p>Telefon görünümünde dilleri, tanıtımı ve bağlantıları buradan inceleyebilirsin.</p><div class="controls"><button data-page="product" aria-pressed="true">Tanıtım</button><button data-page="support" aria-pressed="false">Destek</button><button data-page="privacy" aria-pressed="false">Gizlilik</button><button data-page="terms" aria-pressed="false">Kullanım koşulları</button></div><p><a id="open" href="daily-planner.html?lang=tr" target="_blank" rel="noopener">Tam sayfayı aç ↗</a></p><div class="frame"><iframe id="preview" title="Daily Planner önizleme" src="daily-planner.html?lang=tr"></iframe></div><p class="note">Görsellerin üzerindeki metinler web önizlemelerinde seçilen dilde gösterilir. Uygulamanın kendisi şu an Türkçe ve İngilizcedir. Bu bağlantı siteyi incelemek içindir.</p></main><script>let page='product';const select=document.getElementById('locale');function render(){const path='daily-planner'+(page==='product'?'':'-'+page)+'.html?lang='+select.value;document.getElementById('preview').src=path;document.getElementById('open').href=path;document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)))}select.addEventListener('change',render);document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));</script></body></html>
